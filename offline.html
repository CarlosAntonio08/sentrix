<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0c">
    <title>Sem conexão — Sentrix</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/icons/favicon-32.png">
</head>
<body>
<main class="instalador">
    <div class="instalador-card text-center">
        <img src="assets/icons/icon-192.png" alt="" width="96" height="96" class="offline-icone">
        <h1 class="block-title">Sem conexão</h1>
        <p class="instalador-texto">O Sentrix não conseguiu falar com o servidor. Verifique a internet
            (ou, no computador, se o INICIAR.bat está aberto) e tente de novo.</p>
        <button type="button" class="btn-primary btn-block" onclick="location.reload()">Tentar novamente</button>
    </div>
</main>
</body>
